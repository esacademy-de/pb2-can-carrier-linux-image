# PB2 CAN Carrier: serial gettys (ttyS2, ttyS7) -- terminal handshake.
#
# 1) TTYReset=no. With the stock TTYReset=yes systemd writes, every time a
#    serial getty starts (twice, in fact: once for the reset, once while setting
#    the tty up):
#      ESC [ ! p   ESC ] 104 BEL   ESC [ ? 7 h        (soft reset, colour reset)
#    and then asks the terminal for its size:
#      ESC [ 6 n   ESC [ 32766;32766 H   ESC [ 6 n    (parks the cursor in the
#                                                      far corner for up to 333 ms)
#    Terminal programs such as WindTerm either print the reset sequences as
#    text ("[!p]104") or, while the cursor is parked, let concurrent
#    kernel/journald output overwrite earlier lines. TTYReset=no removes all of
#    it for these units. Consequence: systemd no longer resets the line
#    discipline when a getty (re)starts (agetty still sets up the line itself)
#    and no longer sizes the tty -- /etc/profile.d/pb2-serial-size.sh does that
#    at login instead.
#
# 2) TERM=xterm-256color. Without it systemd hands serial gettys TERM=vt220,
#    which has no colour capability: no coloured prompt or ls, monochrome
#    htop/mc. xterm-256color matches what WindTerm, Tabby and PuTTY emulate.
[Service]
TTYReset=no
Environment=TERM=xterm-256color
