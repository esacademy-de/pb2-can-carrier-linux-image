# PB2 CAN Carrier: keep the serial gettys from sending terminal reset/query
# sequences to the debug UARTs (ttyS2, ttyS7).
#
# With the stock TTYReset=yes systemd writes, every time a serial getty starts
# (twice, in fact: once for the reset, once while setting the tty up):
#   ESC [ ! p   ESC ] 104 BEL   ESC [ ? 7 h        (soft reset, colour reset)
# and then asks the terminal for its size:
#   ESC [ 6 n   ESC [ 32766;32766 H   ESC [ 6 n    (parks the cursor in the
#                                                   far corner for up to 333 ms)
# Terminal programs such as WindTerm either print the reset sequences as text
# ("[!p]104") or, while the cursor is parked, let concurrent kernel/journald
# output overwrite earlier lines. TTYReset=no removes all of it for these units.
#
# Consequence: systemd no longer resets the line discipline when a getty
# (re)starts; agetty still sets up the line itself.
[Service]
TTYReset=no
