## PB2 CAN Carrier validation config -- derived from
## bb.org-debian-trixie-iot-v6.18-k3-arm64.conf. Trimmed of the heavy
## generic extras (docker, cockpit, code-server, other boards' u-boot
## packages) for a faster first end-to-end pipeline validation; swaps
## the stock bbb.io-kernel-6.18-k3/bbb.io-headers-6.18-k3 packages for
## our own carrier kernel .deb via repo_external. Reconcile with the
## full IoT package set before a real release build.
##
release="13.7"
image_type="pb2-can-carrier-v6.18-k3"
##
##Debootstrap: https://wiki.debian.org/Debootstrap
##
##debootstrap --arch=${deb_arch} --include=${deb_include} --exclude=${deb_exclude} \
##--components=${deb_components} --foreign ${deb_codename} /tmp/tmp.dir/ http://${deb_mirror}
##
deb_distribution="debian"
deb_codename="trixie"
deb_arch="arm64"
deb_mirror=""
deb_components="main contrib non-free non-free-firmware"
deb_cache=""
#
## non-free-firmware component is already enabled above, needed for
## firmware-misc-nonfree in deb_include below: ships
## /usr/lib/firmware/powervr/rogue_33.15.11.3_v1.fw, the firmware the
## mainline drm/imagination kernel driver looks for on this board's real
## GPU (AM6254 SoC, PowerVR Rogue AXE-1-16M -- see RELEASE_NOTES.md item
## 10). Silences a real dmesg probe failure; userspace GPU acceleration
## (Mesa/Vulkan) is a separate, not-yet-attempted piece of work.
#
##
##Auto includes tasksel package
tasksel_lang="task-english"
##
##Multiple tasks must be comma separated, do not force a desktop here yet...
tasksel_task="task-ssh-server"
##
##run [tasksel install standard]
tasksel_standard="enable"
##
deb_include="	\
	bash-completion	\
	bc	\
	bison	\
	build-essential	\
	ca-certificates	\
	can-utils	\
	command-not-found	\
	curl	\
	device-tree-compiler	\
	dosfstools	\
	firmware-misc-nonfree	\
	flex	\
	git	\
	gnupg	\
	gpiod	\
	htop	\
	i2c-tools	\
	initramfs-tools	\
	isc-dhcp-client	\
	kbd	\
	libgpiod-dev	\
	libncurses-dev	\
	libnss-mdns	\
	libssl-dev	\
	linux-base	\
	linux-cpupower	\
	mmc-utils	\
	net-tools	\
	python3-dev	\
	python3-libgpiod	\
	python-is-python3	\
	rsync	\
	rt-tests	\
	ssl-cert	\
	sudo	\
	tio	\
	unzip	\
	usbutils	\
	zstd	\
"
#
#deb_exclude=""
#
##
##Some packages fail to install via debootstrap: deb_additional_pkgs="<comma|space>"
##
deb_additional_pkgs="	\
	ethtool	\
	hdparm	\
	rfkill	\
"
##
rfs_username="debian"
rfs_fullname="Beagle User"
rfs_password="temppwd"
rfs_hostname="pb2-can-carrier"
#rfs_root_password="root"
rfs_disable_root="enable"
rfs_cyber_resilience_act="enable"
rfs_default_locale="en_US.UTF-8"
rfs_etc_dogtag="PB2 CAN Carrier Debian Trixie IOT Image"
rfs_console_banner="PB2 CAN Carrier"
rfs_console_user_pass="enable"
rfs_ssh_banner="PB2 CAN Carrier"
rfs_ssh_user_pass="enable"
rfs_use_systemdnetworkd="enable"
rfs_use_systemdresolved="enable"
##
##enable BeagleBoard kernel/u-boot/support repo: bb-u-boot-pocketbeagle2
##(the stock kernel/headers packages are swapped out below for our own
##carrier kernel via repo_external -- everything else here is generic
##BeagleBoard plumbing this carrier build reuses as-is)
repo_rcnee="enable"
repo_rcnee_arch="arm64"
repo_rcnee_mirror="debian.beagleboard.org"
repo_rcnee_pkg_list="	\
	bbb.io-keyring	\
	bb-beagle-flasher	\
	bb-beagle-version	\
	bb-customizations	\
	bb-usb-gadgets	\
	bb-u-boot-pocketbeagle2	\
	generic-sys-mods	\
	rwmem	\
	ti-devmem2	\
	ti-k3conf	\
"
##
##Our own carrier kernel .deb (built from patches/kernel/*.patch +
##configs/kernel.fragment against the pinned 6.18.37 base -- see
##manifests/sources.lock), served as a small local flat apt repo instead
##of BeagleBoard's stock bbb.io-kernel-6.18-k3/bbb.io-headers-6.18-k3.
repo_external="enable"
repo_external_arch="arm64"
repo_external_key=""
repo_external_server="file:/opt/pb2-carrier-repo/"
repo_external_dist="./"
repo_external_components=""
repo_external_pkg_list="	\
	linux-image-6.18.37-arm64-k3-r56	\
"
##
chroot_COPY_SETUP_SDCARD="enable"
chroot_script="beagleboard.org-trixie-arm64.sh"
chroot_tarball="enable"
keep_ssh_keys="enable"
