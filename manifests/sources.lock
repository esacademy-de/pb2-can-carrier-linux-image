# Pinned source revisions for the PB2 CAN Carrier Linux image.
#
# Every entry is an immutable commit — never a moving branch (work order
# Appendix B, "Version discipline"). Verified reachable at the commit shown
# as of 2026-09-22; re-verify with `git ls-remote` before a real build if
# time has passed, since none of these are release-tagged upstream repos
# that guarantee permanence.

[kernel]
# BeagleBoard/RobertCNelson's kernel build-recipe repo (fetches and patches
# linux-stable; not the kernel source itself -- see kernel.base below).
repo = "https://github.com/RobertCNelson/arm64-multiplatform.git"
branch = "v6.18.x-arm64-k3"
commit = "c284267db7154fe4b792e2272cb38ad7dc61bce7"

[kernel.base]
# What the recipe above actually builds: linux-stable at a specific point
# release. version.sh in the recipe repo currently pins 6.18.52 with
# PREEMPT_RT disabled (kernel_rt=".X-rtY", a literal unset placeholder).
#
# DEVIATION: this build overrides that to 6.18.37, because
# https://mirrors.edge.kernel.org/pub/linux/kernel/projects/rt/6.18/ only
# publishes an RT patch for 6.18.37 (patch-6.18.37-rt6.patch.xz) as of
# 2026-09-22 -- no RT patch exists yet for 6.18.52, and RT patches are
# point-release-specific (they do not apply cleanly to a later stable tag).
# Work order D-05/§3 require PREEMPT_RT, so the base is pinned to whatever
# point release the RT project has actually shipped a patch for, not to
# the recipe's own newer default. See scripts/build-image.sh for the
# override and release notes for the tradeoff (6.18.37 forgoes 15 point
# releases of otherwise-applicable upstream stable fixes).
repo = "https://github.com/gregkh/linux.git"
tag = "v6.18.37"
commit = "0c503cf3dde2e53614f05261ece12f9d3d4c3c20"
rt_patch = "patch-6.18.37-rt6.patch.xz"
rt_patch_url = "https://mirrors.edge.kernel.org/pub/linux/kernel/projects/rt/6.18/patch-6.18.37-rt6.patch.xz"
#
# CONFIRMED BY REAL BUILD ATTEMPT: pinning 6.18.37 also breaks one entry
# in the recipe's own K3 patch series -- its "imagination" backport
# (Imagination PowerVR GPU driver, backported from v6.19.14) fails to
# `git am` cleanly against 6.18.37. That backport targets AM62A/AM68A/
# J721S2 (boards with a PowerVR GPU); AM625/PocketBeagle 2 has no such
# GPU, so scripts/build-image.sh skips just that one patch.sh entry
# (commented out, with the reasoning recorded inline) rather than
# reverting to 6.18.52 and losing PREEMPT_RT. Every other entry in the
# recipe's patch series (TI K3 support, rpi-backports, uio) applies
# cleanly at 6.18.37.

[uboot]
repo = "https://github.com/beagleboard/u-boot.git"
branch = "v2026.01-am62-pocketbeagle2"
commit = "7d2af1199011f2210a862097c78f1b940e5d2631"
# No point-release tag exists on this repo for the current branch head
# (only on the separate beagleboard/u-boot-pocketbeagle2 release mirror,
# whose newest tag v2026.01-am62-pocketbeagle2-11.02.18 does not match this
# commit) -- pinning the branch head commit directly is the correct,
# immutable reference here.

[device-tree]
repo = "https://github.com/beagleboard/BeagleBoard-DeviceTrees.git"
branch = "v6.18.x"
commit = "ee075f0804f41e7440ce579ac8d5552e3acac5c8"
base_dts = "src/arm64/ti/k3-am62-pocketbeagle2.dts"
pinmux_reference = "src/arm64/ti/k3-am62-pocketbeagle2-pinmux.dtsi"
# NOTE: pinmux_reference's own header calls itself "our staging ground,
# anything heading to mainline or rejected" -- it was used only to read
# real header-pin-to-SoC-ball/offset mappings (which reflect the physical
# PCB and are not in flux), not depended on by label from the carrier
# overlay. All pin offsets/modes used in dts/*.dtso were additionally
# cross-checked against linux-stable v6.18's own
# arch/arm64/boot/dts/ti/k3-am625-sk-common.dtsi (RGMII2 + DP83867) and
# k3-am625-sancloud-bbe-2.dts (SPI2), and validated end-to-end by compiling
# the overlay against this exact base commit and applying it with
# fdtoverlay (see dts/README.md).

[firmware]
# External TI blobs U-Boot's final binman packaging needs (see
# RELEASE_NOTES.md limitation #1). Confirmed real, buildable/fetchable:
#
# ARM Trusted Firmware BL31 -- built locally from source, not a blob:
#   repo: https://github.com/ARM-software/arm-trusted-firmware.git
#   tag: v2.14
#   build: make ARCH=aarch64 CROSS_COMPILE=aarch64-linux-gnu- PLAT=k3 \
#          TARGET_BOARD=lite SPD=opteed
#   output: build/k3/lite/release/bl31.bin -- confirmed builds clean.
#
# TI DM firmware + SYSFW -- prebuilt binary blobs, TI's own license (not
# GPL/BSD like the rest of this repo):
#   repo: https://github.com/TexasInstruments/ti-linux-firmware.git
#   branch: ti-linux-firmware
#   needed paths: ti-dm/am62xx/ipc_echo_testb_mcu1_0_release_strip.xer5f,
#     ti-sysfw/ti-fs-firmware-am62x-{gp,hs-fs-enc}.bin (device-variant
#     dependent -- TODO determine whether this PB2 unit is GP or HS-FS
#     silicon; changes which sysfw blob and signing path apply)
#
# TODO NOT YET ATTEMPTED: even with the above, U-Boot's SPL/tiboot3.bin
# still needs a *signed, combined* sysfw+board-config image, produced by
# a THIRD tool (k3-image-gen -- BeagleBoard fork:
# https://github.com/beagleboard/k3-image-gen), which combines the sysfw
# blob with board-specific board-cfg/rm-cfg/pm-cfg YAML via:
#   make ARCH=arm CROSS_COMPILE=arm-none-linux-gnueabihf- SOC=am62x \
#     SBL=<r5-spl-build-output> SYSFW_PATH=<ti-sysfw-blob>
# This whole chain (SYSFW + k3-image-gen + GP/HS signing) is identical
# for any PocketBeagle 2 image, carrier or not -- it is exactly the piece
# beagleboard/image-builder's own u-boot packaging stage already solves,
# which is why work order §3 says to build on "the BeagleBoard Debian
# image" rather than reinvent K3 secure-boot packaging here. Treated as
# out of scope for this carrier-specific repo; wire in via image-builder
# instead of re-deriving it.

[image-builder]
repo = "https://github.com/beagleboard/image-builder.git"
branch = "master"
commit = "3ca3705ad2a84f693180da13676fc779f3bcf646"
# TODO: re-pin to the exact commit used at build time; this repo has no
# per-release tags, only a moving master branch with dated config files
# (e.g. configs/bb.org-debian-trixie-iot-v6.18-k3-arm64.conf).

[toolchain]
cross_compiler = "gcc-aarch64-linux-gnu (Debian/Ubuntu crossbuild-essential-arm64 package, GCC 13.3.0 as validated in this repo's CI and local WSL build environment)"

[debian-snapshot]
base_config = "configs/bb.org-debian-trixie-iot-v6.18-k3-arm64.conf (beagleboard/image-builder)"
# TODO: pin the exact Debian snapshot.debian.org timestamp used for the
# rootfs at build time, per work order §9.1.
